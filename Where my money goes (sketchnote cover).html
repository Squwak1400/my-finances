<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where my money goes</title>
<style>
/* Colours are the My finances Ledger tokens (Redesign build/theme.css), light and dark */
:root {
  --bg: #dcd2b8; --surface: #f3eedf; --surface-2: #ebe4d0; --line: #c9bfa5;
  --text: #1a1a18; --text-2: #4a463b; --muted: #6a6350;
  --s1: #1b4b5a; --s2: #a04a2a; --s3: #2f6b3f; --s4: #a8812a; --s5: #8a4d6e; --s7: #4b4f7c;
  --serif: "Sitka Text", "Sitka Small", Cambria, Georgia, serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --hand: "Segoe Print", "Ink Free", cursive;
  --sk-box:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 8' preserveAspectRatio='none'><path d='M2 4.6C250 3 610 5.6 998 3.4' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 0 / 100% 8px,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 8' preserveAspectRatio='none'><path d='M999 3.6C700 4.8 300 2.6 1.4 4.4' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 100% / 100% 8px,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 1000' preserveAspectRatio='none'><path d='M4.4 999C3.2 700 5 300 3.8 1.6' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 0 / 8px 100%,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 1000' preserveAspectRatio='none'><path d='M3.6 1.2C4.8 300 2.6 700 4.1 998.6' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 100% 0 / 8px 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f; --surface: #23201a; --surface-2: #2b2720; --line: #463f33;
    --text: #efe8d6; --text-2: #cbc2ab; --muted: #9b927b;
    --s1: #86b9bd; --s2: #e2906a; --s3: #92c69f; --s4: #d8b46a; --s5: #c98fb0; --s7: #9da2d6;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f; --surface: #23201a; --surface-2: #2b2720; --line: #463f33;
  --text: #efe8d6; --text-2: #cbc2ab; --muted: #9b927b;
  --s1: #86b9bd; --s2: #e2906a; --s3: #92c69f; --s4: #d8b46a; --s5: #c98fb0; --s7: #9da2d6;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--serif); padding: 28px 16px 40px; }
.drawn { position: relative; }
.drawn::after { content: ""; position: absolute; inset: -3px; pointer-events: none; background: var(--text);
  -webkit-mask: var(--sk-box); mask: var(--sk-box); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }

/* the 16:9 page */
.page { max-width: 1280px; margin: 0 auto; padding: 34px 36px 30px; background-color: var(--surface);
  background-image: radial-gradient(color-mix(in srgb, var(--muted) 28%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; }
.cover { position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 44px 40px; align-items: center; }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.arrows path { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: url(#skwob); }
.arrows .trail { stroke-dasharray: 4 6; }

/* the hub: a hand-drawn browser window */
.hub { grid-column: 4 / 10; grid-row: 2; position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
.win { background: var(--surface); border-radius: 14px 10px 15px 11px / 11px 15px 10px 14px; box-shadow: inset 0 0 0 2.2px var(--text); padding: 0 0 20px; }
.win .bar { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border-bottom: 2px solid var(--text); }
.win .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--text); }
.win .dot:nth-child(1) { background: color-mix(in srgb, var(--s2) 45%, var(--surface)); }
.win .dot:nth-child(2) { background: color-mix(in srgb, var(--s4) 45%, var(--surface)); }
.win .dot:nth-child(3) { background: color-mix(in srgb, var(--s3) 45%, var(--surface)); }
.win .url { flex: 1; min-width: 0; margin-left: 8px; padding: 1px 12px; border-radius: 9px 7px 10px 8px; box-shadow: inset 0 0 0 1.4px color-mix(in srgb, var(--text) 55%, transparent);
  font: 400 12.5px var(--mono); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win .tools { font: 400 14px var(--mono); color: var(--text-2); letter-spacing: 4px; }
.win .body { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 18px; padding: 18px 26px 0; }
.win .mascot { grid-row: span 2; width: 112px; height: 90px; overflow: visible; }
.win h1 { margin: 0; font: 700 33px/1.25 var(--hand); letter-spacing: .01em; }
.win .uline { display: block; width: 92%; height: 10px; margin-top: -2px; overflow: visible; }
.win .uline path { fill: none; stroke: var(--s2); stroke-width: 2.6; stroke-linecap: round; filter: url(#skwob); }
.win .sub { grid-column: 1 / -1; margin: 6px 0 0; font: 400 16px var(--hand); color: var(--text-2); }
.win .sub b { font: 600 17px var(--mono); color: var(--text); }
/* one dollar bar, every category in its group colour */
.dollar { grid-column: 1 / -1; justify-self: stretch; display: flex; gap: 3px; height: 26px; margin-top: 10px; }
.dollar span { display: block; border-radius: 3px 2px 4px 2px; box-shadow: inset 0 0 0 1.5px var(--c);
  background: repeating-linear-gradient(-45deg, var(--c) 0 1.6px, transparent 1.6px 5px), color-mix(in srgb, var(--c) 24%, transparent); }
.dollar-k { grid-column: 1 / -1; justify-self: stretch; display: flex; justify-content: space-between; font: 400 12px var(--serif); color: var(--text-2); }

/* icon tiles under the hub */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tile { display: grid; justify-items: center; gap: 1px; padding: 10px 4px 9px; text-align: center; background: var(--surface); }
.tile svg { width: 26px; height: 26px; overflow: visible; }
.tile svg * { fill: none; stroke: var(--c, var(--s1)); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile .k { font: 400 13px/1.3 var(--hand); }
.tile b { font: 600 14px var(--mono); }

/* the 8 panels in a ring */
.panel { position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; padding: 16px 16px 14px 18px;
  background: color-mix(in srgb, var(--c) 10%, var(--surface)); transform: rotate(var(--r)); }
.panel .hd { grid-column: 1 / -1; display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
.badge { display: grid; place-items: center; flex: none; width: 27px; height: 27px; border-radius: 50%; font: 600 13px var(--mono);
  box-shadow: inset 0 0 0 1.8px var(--s1); background: var(--surface); color: var(--text); }
.panel .nm { font: 400 19px/1.25 var(--hand); }
.panel .art { width: 62px; height: 62px; overflow: visible; }
.panel .amt { display: block; font: 600 22px/1.2 var(--mono); }
.panel ul { margin: 2px 0 0; padding: 0; list-style: none; font: 400 13.5px/1.45 var(--serif); color: var(--text-2); }
.panel li::before { content: "✓"; margin-right: 6px; font: 700 13px var(--hand); color: var(--c); }

/* cartoon objects (the app's Illustrated drawings) */
svg :is(.b, .w) { fill: color-mix(in srgb, var(--c, var(--s1)) 26%, var(--surface)); stroke: var(--text); stroke-width: 2; stroke-linejoin: round; }
svg .w { fill: var(--text); }
svg .ln { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .ln.c { stroke: var(--c, var(--s1)); }
svg .c.f { fill: var(--c, var(--s1)); stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
svg .face circle { fill: var(--text); }
svg .face path { fill: none; stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; }
svg .face .blush { fill: color-mix(in srgb, var(--s5) 45%, transparent); }
svg .drop { fill: color-mix(in srgb, var(--s1) 35%, var(--surface)); stroke: var(--text); stroke-width: 1.4; }
svg .spark { fill: var(--s4); }
svg .heart { fill: color-mix(in srgb, var(--s2) 55%, var(--surface)); stroke: none; }
svg .coin { fill: color-mix(in srgb, var(--s4) 55%, var(--surface)); stroke: var(--text); stroke-width: 1.6; }
svg .flap { fill: var(--s1); stroke: var(--text); stroke-width: 2; stroke-linejoin: round; }
svg :is(.b, .ln, .c.f, .flap, .coin) { filter: url(#skwob); }

/* footer: legend and leafy sprigs */
.foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 34px; }
.sprig { width: 120px; height: 34px; flex: none; overflow: visible; }
.sprig path { fill: none; stroke: var(--s3); stroke-width: 1.7; stroke-linecap: round; filter: url(#skwob); }
.sprig .lf { fill: color-mix(in srgb, var(--s3) 30%, var(--surface)); }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; margin: 0; padding: 0; list-style: none; font: 400 15px var(--hand); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend .sw { width: 26px; height: 14px; border-radius: 3px 2px 4px 2px; box-shadow: inset 0 0 0 1.5px var(--c);
  background: repeating-linear-gradient(-45deg, var(--c) 0 1.6px, transparent 1.6px 5px), color-mix(in srgb, var(--c) 24%, transparent); }
.fnote { margin: 12px 0 0; text-align: center; font: italic 400 13px var(--serif); color: var(--muted); }
.decor { position: absolute; pointer-events: none; overflow: visible; }

/* narrower screens: hub on top, panels in two columns, no arrows */
@media (max-width: 980px) {
  .cover { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }
  .cover > * { grid-column: auto !important; grid-row: auto !important; }
  .hub { grid-column: 1 / -1 !important; order: -1; }
  .arrows, .decor { display: none; }
}
@media (max-width: 640px) {
  body { padding: 16px 16px 28px; }
  .page { padding: 20px 14px 18px; }
  .cover { grid-template-columns: minmax(0, 1fr); }
  .win .body { padding: 14px 14px 0; grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .win .mascot { grid-row: auto; width: 96px; height: 76px; }
  .win h1 { font-size: 27px; } .win .uline { margin: 0 auto; }
  .win .tools { display: none; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles .tile:last-child { grid-column: 1 / -1; }
  .foot { flex-direction: column; } .sprig { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="skwob" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<main class="page drawn">
  <div class="cover" id="cover"></div>
  <div class="foot">
    <svg class="sprig" viewBox="0 0 120 34" aria-hidden="true"><path d="M4 30C30 26 60 22 116 8"/><path class="lf" d="M30 26c-2-8 4-12 9-12-1 6-4 10-9 12zM55 21c0-8 7-11 11-10-2 6-6 9-11 10zM80 15c1-7 8-9 12-8-3 6-7 8-12 8zM42 24c6-5 13-3 15 1-6 2-11 2-15-1zM68 18c6-4 13-2 14 2-6 1-10 1-14-2z"/></svg>
    <ul class="legend" id="legend"></ul>
    <svg class="sprig" viewBox="0 0 120 34" aria-hidden="true" style="transform:scaleX(-1)"><path d="M4 30C30 26 60 22 116 8"/><path class="lf" d="M30 26c-2-8 4-12 9-12-1 6-4 10-9 12zM55 21c0-8 7-11 11-10-2 6-6 9-11 10zM80 15c1-7 8-9 12-8-3 6-7 8-12 8zM42 24c6-5 13-3 15 1-6 2-11 2-15-1zM68 18c6-4 13-2 14 2-6 1-10 1-14-2z"/></svg>
  </div>
  <p class="fnote">Sample numbers for the design, not your real spending.</p>
</main>

<script>
// ── The data. Same categories, groups and colours as "Where my money goes (sketchy).html".
// Keep this shape for the interactive version.
const PAY = 5000;
const GROUPS = {
  home:     { name: "Home",     c: "var(--s1)", note: "rent & bills" },
  everyday: { name: "Everyday", c: "var(--s4)", note: "food & getting around" },
  fun:      { name: "Fun",      c: "var(--s2)", note: "treats" },
  debt:     { name: "Debt",     c: "var(--s5)", note: "paying it down" },
  savings:  { name: "Savings",  c: "var(--s3)", note: "for later" }
};
const DATA = [
  { cat: "Housing",        amount: 1650, group: "home",     art: "house", note: "rent + insurance" },
  { cat: "Saved",          amount: 1180, group: "savings",  art: "piggy", note: "TFSA + emergency fund" },
  { cat: "Groceries",      amount: 620,  group: "everyday", art: "bag",   note: "about $155 a week" },
  { cat: "Transportation", amount: 420,  group: "everyday", art: "car",   note: "gas + transit pass" },
  { cat: "Debt payments",  amount: 350,  group: "debt",     art: "card",  note: "credit card first" },
  { cat: "Dining out",     amount: 310,  group: "fun",      art: "bowl",  note: "about 8 meals out" },
  { cat: "Shopping",       amount: 280,  group: "fun",      art: "shop",  note: "clothes + home bits" },
  { cat: "Utilities",      amount: 190,  group: "home",     art: "bulb",  note: "hydro + internet" }
];

// ── Cartoon objects (64 × 64), the same drawings as the app's Illustrated view
const face = (x, y, mood = "") => `<g class="face">${mood === "worry" ? `<path d="M${x - 9} ${y - 4.5}l4.5 -2.2M${x + 9} ${y - 4.5}l-4.5 -2.2"/>` : ""}<circle cx="${x - 6}" cy="${y}" r="1.9"/><circle cx="${x + 6}" cy="${y}" r="1.9"/>` +
  (mood === "worry" ? `<path d="M${x - 3} ${y + 6}q3 -3 6 0"/>` : `<path d="M${x - 3.2} ${y + 4}q3.2 3 6.4 0"/>`) +
  `<ellipse class="blush" cx="${x - 10}" cy="${y + 4}" rx="2.6" ry="1.5"/><ellipse class="blush" cx="${x + 10}" cy="${y + 4}" rx="2.6" ry="1.5"/></g>`;
const ART = {
  house: `<path class="b" d="M13 31 32 14l19 17v22H13z"/><path class="ln c" d="M8 32 32 10l24 22"/><path class="ln" d="M27 53v-7h10v7"/>${face(32, 34)}`,
  bag: `<path class="ln c" d="M24 24c-3-6-5-9-4-13M27 24c0-5 2-9 6-11M38 24c2-5 6-8 10-8"/><path class="b" d="M14 24h36l-3 30H17z"/>${face(32, 38)}`,
  bowl: `<path class="ln" d="M24 26c-3-4 3-6 0-11M32 26c-3-4 3-6 0-11"/><path class="ln c" d="M40 30 53 11M44 31 57 14"/><path class="b" d="M9 31h46c0 12-10 21-23 21S9 43 9 31z"/>${face(32, 38)}`,
  car: `<path class="b" d="M7 44v-8c0-3 2-5 5-5h5l6-10h18l6 10h5c3 0 5 2 5 5v8z"/><path class="ln" d="M24 31l4-6h8l4 6"/><circle class="w" cx="19" cy="46" r="5"/><circle class="w" cx="45" cy="46" r="5"/>${face(32, 37)}`,
  shop: `<path class="ln" d="M24 22c0-11 16-11 16 0"/><path class="b" d="M14 22h36l-2 32H16z"/><path class="c f" d="M44 26c-1.5-2.5-5.5-1-4 2l4 3.5 4-3.5c1.5-3-2.5-4.5-4-2z"/>${face(30, 40)}`,
  bulb: `<path class="ln c" d="M7 22h-4M61 22h-4M12 8 9 5M52 8l3-3"/><path class="b" d="M32 7c-11 0-18 8-18 17 0 7 5 11 8 15v6h20v-6c3-4 8-8 8-15 0-9-7-17-18-17z"/><path class="ln" d="M24 50h16M26 55h12"/>${face(32, 25)}`,
  card: `<rect class="b" x="5" y="17" width="54" height="34" rx="5"/><path class="c f" d="M5 25h54v6H5z"/><path class="drop" d="M54 5c-3 4-3 7 0 7s3-3 0-7z"/>${face(28, 41, "worry")}`,
  piggy: `<circle class="c f" cx="34" cy="8" r="4.5"/><path class="b" d="M11 35c0-10 9-17 21-17s21 7 21 16c0 6-3 10-7 12v7h-6v-5H26v5h-6v-7c-5-2-9-6-9-11z"/><path class="ln" d="M53 31l5-2M27 18c1-4 6-5 8-2"/>${face(29, 33)}`
};
const SPARK = (x, y, s = 1) => `<path class="spark" d="M${x} ${y - 6 * s}q${s} ${5 * s} ${6 * s} ${6 * s}q${-5 * s} ${s} ${-6 * s} ${6 * s}q${-s} ${-5 * s} ${-6 * s} ${-6 * s}q${5 * s} ${-s} ${6 * s} ${-6 * s}z"/>`;
const HEART = (x, y, s = 1) => `<path class="heart" d="M${x} ${y + 5 * s}c${-6 * s} ${-4 * s} ${-7 * s} ${-8 * s} ${-4 * s} ${-10 * s}c${2 * s} ${-1.4 * s} ${4 * s} 0 ${4 * s} ${2 * s}c0 ${-2 * s} ${2 * s} ${-3.4 * s} ${4 * s} ${-2 * s}c${3 * s} ${2 * s} ${2 * s} ${6 * s} ${-4 * s} ${10 * s}z"/>`;
// small doodle icons for the tiles (24 × 24)
const ICON = {
  spent: `<path d="M4 8h16v11H4zM4 11h16"/><path d="M8 15h3"/>`,
  saved: `<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 18v2h16v-2"/>`,
  debt: `<path d="M5 12l4 4 10-10"/><path d="M4 20h16"/>`,
  top: `<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/>`,
  job: `<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9c-.6-1-1.5-1.4-2.5-1.4-1.6 0-2.6.8-2.6 2s1 1.6 2.6 2 2.7.9 2.7 2.1-1.2 2-2.7 2c-1.1 0-2.1-.5-2.7-1.4M12 6v1.6M12 16.4V18"/>`
};
const fmt = n => "$" + Math.round(n).toLocaleString("en-CA");

// ring around the hub on a 12-column grid, clockwise from top-left
const SPOT = [["1 / 5", 1], ["5 / 9", 1], ["9 / 13", 1], ["10 / 13", 2], ["9 / 13", 3], ["5 / 9", 3], ["1 / 5", 3], ["1 / 4", 2]];
const TILT = [-.9, .6, -.4, .8, -.7, .5, -.8, .6];

const by = g => DATA.filter(d => d.group === g).reduce((a, d) => a + d.amount, 0);
const spent = DATA.filter(d => d.group !== "savings" && d.group !== "debt").reduce((a, d) => a + d.amount, 0);
const biggest = DATA.reduce((a, d) => d.amount > a.amount ? d : a);
const total = DATA.reduce((a, d) => a + d.amount, 0);
const tiles = [
  { k: "Spent", v: fmt(spent), icon: "spent", c: "var(--s2)" },
  { k: "Saved", v: fmt(by("savings")), icon: "saved", c: "var(--s3)" },
  { k: "Debt paid", v: fmt(by("debt")), icon: "debt", c: "var(--s5)" },
  { k: "Biggest", v: biggest.cat, icon: "top", c: "var(--s4)" },
  { k: "Every dollar", v: total >= PAY ? "has a job" : fmt(PAY - total) + " free", icon: "job", c: "var(--s1)" }
];

const cover = document.getElementById("cover");
cover.innerHTML = `<svg class="arrows" aria-hidden="true"></svg>
  <div class="hub">
    <div class="win">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">my-finances / where-my-money-goes</span><span class="tools" aria-hidden="true">‹ › ⋯</span></div>
      <div class="body">
        <svg class="mascot" viewBox="0 0 120 96" aria-hidden="true" style="--c:var(--s1)">
          ${SPARK(14, 20, .9)}${SPARK(106, 14, 1.1)}${SPARK(100, 50, .7)}
          <circle class="coin" cx="30" cy="12" r="6"/><circle class="coin" cx="88" cy="28" r="5"/><circle class="coin" cx="18" cy="44" r="4.5"/>
          <path class="ln" d="M33 56c-8-2-12-10-10-16M87 56c8-2 12-12 9-18"/>
          <path class="b" d="M30 40h58c3 0 5 2 5 5v36c0 3-2 5-5 5H30c-3 0-5-2-5-5V45c0-3 2-5 5-5z"/><path class="flap" d="M70 54h23v16H70z"/><circle class="ln" cx="77" cy="62" r="2"/>
          ${face(48, 60)}
        </svg>
        <div><h1>Where my money goes</h1><svg class="uline" viewBox="0 0 380 10" preserveAspectRatio="none" aria-hidden="true"><path d="M4 6C70 3 140 8 200 5S320 3 376 6"/></svg></div>
        <p class="sub"><b>${fmt(PAY)}</b> take-home · one month, one pay cheque</p>
        <div class="dollar" aria-hidden="true">${DATA.map(d => `<span style="--c:${GROUPS[d.group].c};flex:${d.amount}"></span>`).join("")}</div>
        <div class="dollar-k"><span>every dollar of pay →</span><span>${fmt(PAY)}</span></div>
      </div>
    </div>
    <div class="tiles">${tiles.map(t => `<div class="tile drawn" style="--c:${t.c}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t.icon]}</svg><span class="k">${t.k}</span><b>${t.v}</b></div>`).join("")}</div>
  </div>
  ${DATA.map((d, i) => { const g = GROUPS[d.group]; return `
  <div class="panel drawn" style="grid-column:${SPOT[i][0]};grid-row:${SPOT[i][1]};--c:${g.c};--r:${TILT[i]}deg">
    <div class="hd"><span class="badge">${i + 1}</span><span class="nm">${d.cat}</span></div>
    <svg class="art" viewBox="0 0 64 64" aria-hidden="true">${ART[d.art]}</svg>
    <div><b class="amt">${fmt(d.amount)}</b><ul><li>${Math.round(d.amount / PAY * 100)}% of pay</li><li>${d.note}</li></ul></div>
  </div>`; }).join("")}`;

document.getElementById("legend").innerHTML = Object.values(GROUPS).map(g =>
  `<li style="--c:${g.c}"><span class="sw" aria-hidden="true"></span>${g.name}</li>`).join("");

// curvy dotted arrows from the browser window out to every panel (wide screens only)
function drawArrows() {
  const svg = cover.querySelector(".arrows");
  if (getComputedStyle(svg).display === "none") return;
  const box = cover.getBoundingClientRect(), hb = cover.querySelector(".hub").getBoundingClientRect();
  const cx = hb.left + hb.width / 2 - box.left, cy = hb.top + hb.height / 2 - box.top;
  svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
  svg.innerHTML = [...cover.querySelectorAll(".panel")].map((el, i) => {
    const r = el.getBoundingClientRect(), tx = r.left + r.width / 2 - box.left, ty = r.top + r.height / 2 - box.top;
    const dx = tx - cx, dy = ty - cy, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const s = Math.min(Math.abs(hb.width / 2 / (ux || 1e-6)), Math.abs(hb.height / 2 / (uy || 1e-6))) + 6;
    const e = Math.min(Math.abs(r.width / 2 / (ux || 1e-6)), Math.abs(r.height / 2 / (uy || 1e-6))) + 8;
    const x1 = cx + ux * s, y1 = cy + uy * s, x2 = tx - ux * e, y2 = ty - uy * e;
    if (Math.hypot(x2 - x1, y2 - y1) < 18) return "";
    const bend = (i % 2 ? 1 : -1) * 14, mx = (x1 + x2) / 2 - uy * bend, my = (y1 + y2) / 2 + ux * bend;
    const ang = Math.atan2(y2 - my, x2 - mx), h = 9;
    const a1 = [x2 - h * Math.cos(ang - .5), y2 - h * Math.sin(ang - .5)], a2 = [x2 - h * Math.cos(ang + .5), y2 - h * Math.sin(ang + .5)];
    return `<path class="trail" d="M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}"/><path d="M${a1}L${x2} ${y2}L${a2}"/>`;
  }).join("");
}
drawArrows();
addEventListener("resize", drawArrows);
document.fonts?.ready.then(drawArrows);
</script>
