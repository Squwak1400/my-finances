<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statements sketches v2</title>
<style>
/* Mockups only (v2, compact): the Statements graphs in the sketch style, each about the size of its card in the app.
   Colours are the My finances Ledger tokens. */
:root {
  --bg: #dcd2b8; --surface: #f3eedf; --surface-2: #ebe4d0; --line: #c9bfa5;
  --text: #1a1a18; --text-2: #4a463b; --muted: #6a6350;
  --s1: #1b4b5a; --s2: #a04a2a; --s3: #2f6b3f; --s4: #a8812a; --s5: #8a4d6e; --s7: #4b4f7c;
  --good: #2f6b3f; --bad: #a03a2a;
  --serif: "Sitka Text", "Sitka Small", Cambria, Georgia, serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --hand: "Segoe Print", "Ink Free", cursive;
  --sk-box:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 8' preserveAspectRatio='none'><path d='M2 4.6C250 3 610 5.6 998 3.4' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 0 / 100% 8px,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 8' preserveAspectRatio='none'><path d='M999 3.6C700 4.8 300 2.6 1.4 4.4' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 100% / 100% 8px,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 1000' preserveAspectRatio='none'><path d='M4.4 999C3.2 700 5 300 3.8 1.6' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 0 / 8px 100%,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 1000' preserveAspectRatio='none'><path d='M3.6 1.2C4.8 300 2.6 700 4.1 998.6' fill='none' stroke='%23000' stroke-width='1.6' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 100% 0 / 8px 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f; --surface: #23201a; --surface-2: #2b2720; --line: #463f33;
    --text: #efe8d6; --text-2: #cbc2ab; --muted: #9b927b;
    --s1: #86b9bd; --s2: #e2906a; --s3: #92c69f; --s4: #d8b46a; --s5: #c98fb0; --s7: #9da2d6;
    --good: #92c69f; --bad: #ee8f7d;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f; --surface: #23201a; --surface-2: #2b2720; --line: #463f33;
  --text: #efe8d6; --text-2: #cbc2ab; --muted: #9b927b;
  --s1: #86b9bd; --s2: #e2906a; --s3: #92c69f; --s4: #d8b46a; --s5: #c98fb0; --s7: #9da2d6;
  --good: #92c69f; --bad: #ee8f7d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--serif); padding: 28px 16px 40px; }
.drawn { position: relative; }
.drawn::after { content: ""; position: absolute; inset: -3px; pointer-events: none; background: var(--text);
  -webkit-mask: var(--sk-box); mask: var(--sk-box); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }

/* the page and its cards, laid out like the Statements summary */
.page { max-width: 1200px; margin: 0 auto; padding: 30px 32px 22px; background-color: var(--surface);
  background-image: radial-gradient(color-mix(in srgb, var(--muted) 24%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; }
.page-k { margin: 0 0 18px; font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 28px; align-items: start; }
.cardx { padding: 18px 20px 16px; background: var(--surface); min-width: 0; }
.cardx.full { grid-column: 1 / -1; }
.cardx header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: start; }
.cardx h2 { margin: 0; font: 400 23px/1.3 var(--hand); }
.cardx .uline { display: block; width: min(260px, 90%); height: 8px; margin: -2px 0 2px; overflow: visible; }
.cardx .uline path { fill: none; stroke: var(--s2); stroke-width: 2.4; stroke-linecap: round; filter: url(#skwob); }
.cardx .mascot { grid-row: span 3; width: 66px; height: 53px; overflow: visible; }
.cardx .desc { margin: 0; font: 400 14px/1.5 var(--serif); color: var(--text-2); }
.say { margin: 10px 0 12px; font: 400 15.5px/1.5 var(--hand); }
.say b { font: 600 15px var(--mono); }
b.over, .over { color: var(--bad); } b.good, .good { color: var(--good); }

/* rows: small cartoon, name, hatched bar, figure */
.rows { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.rows li { display: grid; grid-template-columns: 34px 112px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.rows .ic { width: 34px; height: 34px; overflow: visible; }
.rows .nm { font: 400 14.5px/1.2 var(--hand); min-width: 0; }
.rows .nm small { display: block; font: 400 11.5px/1.3 var(--serif); color: var(--text-2); }
.rows .fig { font: 600 13.5px var(--mono); text-align: right; white-space: nowrap; }
.rows .fig small { display: block; font: 400 11.5px var(--serif); }
.rows.wide li { grid-template-columns: 34px 168px minmax(0, 1fr) auto; }
.track { position: relative; height: 14px; }
.track .bar, .split .bar { position: absolute; top: 0; bottom: 0; border-radius: 3px 2px 4px 2px; box-shadow: inset 0 0 0 1.5px var(--c);
  background: repeating-linear-gradient(-45deg, var(--c) 0 1.6px, transparent 1.6px 5px), color-mix(in srgb, var(--c) 22%, transparent); }
.track .bar { left: 0; }
.track .plan { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--text); }
.split { display: grid; grid-template-columns: 1fr 1fr; height: 14px; }
.split > span { position: relative; }
.split > span:first-child { border-right: 1.6px solid var(--text); }
.pill { display: inline-block; padding: 0 8px; border-radius: 10px 8px 11px 9px; font: 600 12.5px/1.6 var(--mono); box-shadow: inset 0 0 0 1.4px currentColor; }
.rank { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 4px; border-radius: 50%; font: 600 11px var(--mono); box-shadow: inset 0 0 0 1.5px var(--s1); vertical-align: 1px; }
.fnote { margin: 10px 0 0; font: 400 12.5px/1.45 var(--serif); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 0; padding: 0; list-style: none; font: 400 13px var(--hand); color: var(--text-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend .sw { width: 20px; height: 11px; border-radius: 3px 2px 4px 2px; box-shadow: inset 0 0 0 1.4px var(--c);
  background: repeating-linear-gradient(-45deg, var(--c) 0 1.6px, transparent 1.6px 5px), color-mix(in srgb, var(--c) 22%, transparent); }
.legend .sw.dash { width: 0; height: 14px; box-shadow: none; background: none; border-left: 2px dashed var(--text); }

/* month chart */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 400 11.5px var(--mono); fill: var(--text-2); }
.chart text.v { fill: var(--text); font-weight: 600; }
.chart text.h { font: 400 13.5px var(--hand); fill: var(--text); }
.chart .axis { stroke: var(--text); stroke-width: 1.6; fill: none; stroke-linecap: round; filter: url(#skwob); }
.chart .mk { stroke-width: 1.6; filter: url(#skwob); }
.with-note { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 14px; align-items: start; }
.notes { display: grid; gap: 16px; }
.sticky { position: relative; isolation: isolate; padding: 16px 12px 10px; transform: rotate(1.2deg); font: 400 13px/1.45 var(--serif); color: var(--text-2); }
.sticky::before { content: ""; position: absolute; inset: 0; z-index: -1; background: color-mix(in srgb, var(--s4) 16%, var(--surface-2)); border-radius: 3px; }
.sticky + .sticky { transform: rotate(-.8deg); --tp: var(--s2); }
.sticky b { display: block; font: 400 14.5px/1.3 var(--hand); color: var(--text); }
.sticky .tape { position: absolute; top: -8px; left: 50%; width: 48px; height: 14px; margin-left: -24px; transform: rotate(-3deg);
  background: color-mix(in srgb, var(--tp, var(--s1)) 22%, transparent); border: 1px solid color-mix(in srgb, var(--tp, var(--s1)) 45%, transparent); }

/* credit cards: month columns with a cartoon card, a mark per card, and a stamp */
.ccgrid { display: grid; grid-template-columns: 104px repeat(var(--n), minmax(0, 1fr)); gap: 6px 8px; align-items: center; text-align: center; margin-top: 6px; }
.ccgrid .lab { text-align: left; font: 400 15px var(--hand); }
.ccgrid .mo { display: grid; justify-items: center; font: 400 14.5px/1.2 var(--hand); }
.ccgrid .mo svg { width: 46px; height: 46px; overflow: visible; }
.ccgrid .cell { display: grid; justify-items: center; }
.ccgrid .cell svg { width: 30px; height: 30px; overflow: visible; }
.ccgrid .cell small { font: 400 11.5px var(--mono); color: var(--text-2); }
.ccgrid .cell small.over { color: var(--bad); font-weight: 600; }
.stamp { display: inline-block; padding: 1px 6px; font: 700 10px/1.45 var(--mono); letter-spacing: .06em; text-transform: uppercase; transform: rotate(-4deg);
  border: 1.8px dashed currentColor; border-radius: 4px 3px 5px 3px; white-space: nowrap; }
.ccgrid .short { display: none; }
.stamp.good { color: var(--good); } .stamp.bad { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 14px 0 0; padding: 0; list-style: none; }
.chips li { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 8px; border-radius: 12px 9px 13px 10px; font: 400 13.5px var(--hand);
  box-shadow: inset 0 0 0 1.4px color-mix(in srgb, var(--text) 45%, transparent); }
.chips li svg { width: 18px; height: 18px; } .chips li svg * { fill: none; stroke: var(--c); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.chips b { font: 600 13px var(--mono); }

/* cartoon objects */
svg :is(.b, .w) { fill: color-mix(in srgb, var(--c, var(--s1)) 26%, var(--surface)); stroke: var(--text); stroke-width: 2; stroke-linejoin: round; }
svg .w { fill: var(--text); }
svg .ln { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg .ln.c { stroke: var(--c, var(--s1)); }
svg .c.f { fill: var(--c, var(--s1)); stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
svg .face circle { fill: var(--text); }
svg .face path { fill: none; stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; }
svg .face .blush { fill: color-mix(in srgb, var(--s5) 45%, transparent); }
svg .drop { fill: color-mix(in srgb, var(--s1) 35%, var(--surface)); stroke: var(--text); stroke-width: 1.4; }
svg .spark { fill: var(--s4); }
svg .coin { fill: color-mix(in srgb, var(--s4) 55%, var(--surface)); stroke: var(--text); stroke-width: 1.6; }
svg .flap { fill: var(--s1); stroke: var(--text); stroke-width: 2; stroke-linejoin: round; }
svg .lbl { font: 700 9px var(--mono); fill: var(--surface); }
svg :is(.b, .ln, .c.f, .flap, .coin) { filter: url(#skwob); }

@media (max-width: 900px) { .sheet { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  body { padding: 16px 16px 28px; } .page { padding: 20px 14px 16px; }
  .cardx { padding: 16px 14px 14px; }
  .rows li { grid-template-columns: 30px minmax(0, 1fr) auto; row-gap: 3px; }
  .rows .ic { width: 30px; height: 30px; grid-row: span 2; }
  .rows .track, .rows .split { grid-column: 2 / -1; grid-row: 2; }
  .with-note { grid-template-columns: minmax(0, 1fr); }
  .notes { grid-template-columns: 1fr 1fr; }
  .ccgrid { grid-template-columns: 70px repeat(var(--n), minmax(0, 1fr)); gap: 6px 3px; }
  .ccgrid .mo svg { width: 32px; height: 32px; } .ccgrid .cell small { display: none; }
  .ccgrid .lab { font-size: 12.5px; } .ccgrid .long, .ccgrid .st-row { display: none; } .ccgrid .short { display: inline; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="skwob" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<main class="page drawn">
  <p class="page-k">Statements · summary (mockup v2, sample numbers)</p>
  <div class="sheet" id="sheet"></div>
</main>
<script>
// ── Sample data for every Statements graph (made up; agrees with the "Where my money goes" mockups:
// pay $5,000, October spending $3,470, saved $1,180, debt payments $350).
const GROUPS = {
  home: { name: "Home", c: "var(--s1)" }, everyday: { name: "Everyday", c: "var(--s4)" }, fun: { name: "Fun", c: "var(--s2)" },
  debt: { name: "Debt", c: "var(--s5)" }, savings: { name: "Savings", c: "var(--s3)" }
};
const CATS = {
  "Housing": { group: "home", art: "house" }, "Utilities": { group: "home", art: "bulb" },
  "Groceries": { group: "everyday", art: "bag" }, "Transportation": { group: "everyday", art: "car" },
  "Dining out": { group: "fun", art: "bowl" }, "Shopping": { group: "fun", art: "shop" },
  "Debt payments": { group: "debt", art: "card" }, "Saved": { group: "savings", art: "piggy" }
};
// Actual vs planned, by category (October)
const ACTUAL = [
  { cat: "Housing", actual: 1650, plan: 1650 }, { cat: "Saved", actual: 1180, plan: 1000 },
  { cat: "Groceries", actual: 620, plan: 550 }, { cat: "Transportation", actual: 420, plan: 450 },
  { cat: "Debt payments", actual: 350, plan: 350 }, { cat: "Dining out", actual: 310, plan: 200 },
  { cat: "Shopping", actual: 280, plan: 300 }, { cat: "Utilities", actual: 190, plan: 220 }
];
// Money in and out by month
const MONTHS = [
  { m: "May", inc: 5000, spend: 3290, debt: 350 }, { m: "Jun", inc: 5000, spend: 3610, debt: 350 },
  { m: "Jul", inc: 5400, spend: 3980, debt: 350, note: "summer bonus" }, { m: "Aug", inc: 5000, spend: 3350, debt: 350 },
  { m: "Sep", inc: 5000, spend: 3720, debt: 350 }, { m: "Oct", inc: 5000, spend: 3470, debt: 350 }
];
// What changed since last month (September → October), biggest moves first
const CHANGES = [
  { cat: "Saved", was: 930, now: 1180 }, { cat: "Dining out", was: 480, now: 310 },
  { cat: "Shopping", was: 410, now: 280 }, { cat: "Transportation", was: 360, now: 420 },
  { cat: "Utilities", was: 240, now: 190 }, { cat: "Groceries", was: 580, now: 620 }
];
// Where you spent the most (October top merchants)
const MERCHANTS = [
  { name: "Maple St. Rentals", amount: 1650, visits: 1, cat: "Housing", art: "house" },
  { name: "Costco", amount: 310, visits: 2, cat: "Groceries", art: "cart" },
  { name: "No Frills", amount: 210, visits: 4, cat: "Groceries", art: "bag" },
  { name: "Petro-Canada", amount: 190, visits: 5, cat: "Transportation", art: "fuel" },
  { name: "Amazon", amount: 160, visits: 3, cat: "Shopping", art: "box" },
  { name: "Hydro One", amount: 120, visits: 1, cat: "Utilities", art: "bulb" },
  { name: "Uber Eats", amount: 96, visits: 4, cat: "Dining out", art: "bowl" },
  { name: "Tim Hortons", amount: 64, visits: 11, cat: "Dining out", art: "coffee" }
];
const MONTH_SPEND = 3470, PLACES = 34, VISITS = 71;
// Credit cards: paid in full? (interest or fees found on the next statement)
const CARDS = ["Visa", "Mastercard"];
const CC = [
  { m: "May", paid: { Visa: 820, Mastercard: 410 }, interest: {} }, { m: "Jun", paid: { Visa: 905, Mastercard: 380 }, interest: {} },
  { m: "Jul", paid: { Visa: 1140, Mastercard: 455 }, interest: {} }, { m: "Aug", paid: { Visa: 760, Mastercard: 390 }, interest: {} },
  { m: "Sep", paid: { Visa: 980, Mastercard: 300 }, interest: { Mastercard: 14.2 } }, { m: "Oct", paid: { Visa: 870, Mastercard: 430 }, interest: {} }
];

// ── Drawings (64 × 64 cartoons, the app's Illustrated set plus a few new ones)
const face = (x, y, mood = "") => `<g class="face">${mood === "worry" ? `<path d="M${x - 9} ${y - 4.5}l4.5 -2.2M${x + 9} ${y - 4.5}l-4.5 -2.2"/>` : ""}<circle cx="${x - 6}" cy="${y}" r="1.9"/><circle cx="${x + 6}" cy="${y}" r="1.9"/>` +
  (mood === "worry" ? `<path d="M${x - 3} ${y + 6}q3 -3 6 0"/>` : `<path d="M${x - 3.2} ${y + 4}q3.2 3 6.4 0"/>`) +
  `<ellipse class="blush" cx="${x - 10}" cy="${y + 4}" rx="2.6" ry="1.5"/><ellipse class="blush" cx="${x + 10}" cy="${y + 4}" rx="2.6" ry="1.5"/></g>`;
const ART = {
  house: m => `<path class="b" d="M13 31 32 14l19 17v22H13z"/><path class="ln c" d="M8 32 32 10l24 22"/><path class="ln" d="M27 53v-7h10v7"/>${face(32, 34, m)}`,
  bag: m => `<path class="ln c" d="M24 24c-3-6-5-9-4-13M27 24c0-5 2-9 6-11M38 24c2-5 6-8 10-8"/><path class="b" d="M14 24h36l-3 30H17z"/>${face(32, 38, m)}`,
  bowl: m => `<path class="ln" d="M24 26c-3-4 3-6 0-11M32 26c-3-4 3-6 0-11"/><path class="ln c" d="M40 30 53 11M44 31 57 14"/><path class="b" d="M9 31h46c0 12-10 21-23 21S9 43 9 31z"/>${face(32, 38, m)}`,
  car: m => `<path class="b" d="M7 44v-8c0-3 2-5 5-5h5l6-10h18l6 10h5c3 0 5 2 5 5v8z"/><path class="ln" d="M24 31l4-6h8l4 6"/><circle class="w" cx="19" cy="46" r="5"/><circle class="w" cx="45" cy="46" r="5"/>${face(32, 37, m)}`,
  shop: m => `<path class="ln" d="M24 22c0-11 16-11 16 0"/><path class="b" d="M14 22h36l-2 32H16z"/><path class="c f" d="M44 26c-1.5-2.5-5.5-1-4 2l4 3.5 4-3.5c1.5-3-2.5-4.5-4-2z"/>${face(30, 40, m)}`,
  bulb: m => `<path class="ln c" d="M7 22h-4M61 22h-4M12 8 9 5M52 8l3-3"/><path class="b" d="M32 7c-11 0-18 8-18 17 0 7 5 11 8 15v6h20v-6c3-4 8-8 8-15 0-9-7-17-18-17z"/><path class="ln" d="M24 50h16M26 55h12"/>${face(32, 25, m)}`,
  card: (m = "worry") => `<rect class="b" x="5" y="17" width="54" height="34" rx="5"/><path class="c f" d="M5 25h54v6H5z"/>${m === "worry" ? `<path class="drop" d="M54 5c-3 4-3 7 0 7s3-3 0-7z"/>` : `<path class="spark" d="M56 4q1 5 6 6q-5 1-6 6q-1-5-6-6q5-1 6-6z"/>`}${face(28, 41, m)}`,
  piggy: m => `<circle class="c f" cx="34" cy="8" r="4.5"/><path class="b" d="M11 35c0-10 9-17 21-17s21 7 21 16c0 6-3 10-7 12v7h-6v-5H26v5h-6v-7c-5-2-9-6-9-11z"/><path class="ln" d="M53 31l5-2M27 18c1-4 6-5 8-2"/>${face(29, 33, m)}`,
  box: m => `<path class="b" d="M10 24 32 14l22 10v24L32 58 10 48z"/><path class="ln" d="M10 24l22 10 22-10M32 34v24"/><path class="ln c" d="M17 44c5 3 10 3 13 0"/>${face(21, 38, m)}`,
  cart: m => `<path class="ln" d="M4 12h8l6 30h30l6-22H15"/><path class="b" d="M16 20h36l-5 18H19z"/><circle class="w" cx="22" cy="50" r="4"/><circle class="w" cx="44" cy="50" r="4"/>${face(34, 28, m)}`,
  fuel: m => `<path class="b" d="M12 12h26v44H12z"/><path class="c f" d="M17 17h16v9H17z"/><path class="ln" d="M38 24h6l4 6v18c0 3 4 3 4 0V22l-5-6"/>${face(25, 40, m)}`,
  coffee: m => `<path class="ln c" d="M22 18c-2-3 2-5 0-9M30 18c-2-3 2-5 0-9M38 18c-2-3 2-5 0-9"/><path class="ln" d="M44 30h4c4 0 6 3 6 6s-2 6-6 6h-4"/><path class="b" d="M12 22h32v20c0 7-5 12-12 12h-8c-7 0-12-5-12-12z"/>${face(28, 37, m)}`,
  cal: (m, label = "") => `<path class="ln" d="M20 8v9M44 8v9"/><rect class="b" x="9" y="13" width="46" height="42" rx="5"/><path class="c f" d="M9 18c0-3 2-5 5-5h36c3 0 5 2 5 5v6H9z"/><text class="lbl" x="32" y="22.5" text-anchor="middle">${label.toUpperCase()}</text>${face(32, 40, m)}`
};
const ICON = {
  coins: `<circle cx="9" cy="14" r="5.5"/><circle cx="15" cy="9" r="5.5"/>`, spent: `<path d="M4 8h16v11H4zM4 11h16"/><path d="M8 15h3"/>`,
  saved: `<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 18v2h16v-2"/>`, check: `<path d="M5 12l4 4 10-10"/><path d="M4 20h16"/>`,
  star: `<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/>`, target: `<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>`,
  up: `<path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/>`, down: `<path d="M4 7l6 6 4-4 6 7"/><path d="M15 16h5v-5"/>`,
  cal: `<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>`, store: `<path d="M4 9l2-5h12l2 5M4 9h16v11H4zM10 20v-5h4v5"/>`,
  walk: `<circle cx="13" cy="4.5" r="1.8"/><path d="M11 21l2-6-3-3 1-4 4 3 3 1M9 12l-3 2"/>`, card: `<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>`,
  warn: `<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>`, flame: `<path d="M12 21c-4 0-6-3-6-6 0-4 4-6 4-11 3 2 4 4 4 6 1-1 2-2 2-3 2 2 2 5 2 8 0 3-2 6-6 6z"/>`
};
const SPARK = (x, y, s = 1) => `<path class="spark" d="M${x} ${y - 6 * s}q${s} ${5 * s} ${6 * s} ${6 * s}q${-5 * s} ${s} ${-6 * s} ${6 * s}q${-s} ${-5 * s} ${-6 * s} ${-6 * s}q${5 * s} ${-s} ${6 * s} ${-6 * s}z"/>`;
const WALLET = mood => `<svg class="mascot" viewBox="0 0 120 96" aria-hidden="true" style="--c:var(--s1)">
  ${SPARK(14, 20, .9)}${SPARK(106, 14, 1.1)}${SPARK(100, 50, .7)}
  <circle class="coin" cx="30" cy="12" r="6"/><circle class="coin" cx="88" cy="28" r="5"/><circle class="coin" cx="18" cy="44" r="4.5"/>
  <path class="ln" d="M33 56c-8-2-12-10-10-16M87 56c8-2 12-12 9-18"/>
  <path class="b" d="M30 40h58c3 0 5 2 5 5v36c0 3-2 5-5 5H30c-3 0-5-2-5-5V45c0-3 2-5 5-5z"/><path class="flap" d="M70 54h23v16H70z"/><circle class="ln" cx="77" cy="62" r="2"/>
  ${face(48, 60, mood)}</svg>`;
const SPRIG = flip => `<svg class="sprig" viewBox="0 0 120 34" aria-hidden="true"${flip ? ' style="transform:scaleX(-1)"' : ""}><path d="M4 30C30 26 60 22 116 8"/><path class="lf" d="M30 26c-2-8 4-12 9-12-1 6-4 10-9 12zM55 21c0-8 7-11 11-10-2 6-6 9-11 10zM80 15c1-7 8-9 12-8-3 6-7 8-12 8zM42 24c6-5 13-3 15 1-6 2-11 2-15-1zM68 18c6-4 13-2 14 2-6 1-10 1-14-2z"/></svg>`;
const fmt = (n, d = 0) => (n < 0 ? "−" : "") + "$" + Math.abs(n).toLocaleString("en-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const colOf = cat => GROUPS[CATS[cat].group].c;
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
// a hatch pattern for SVG marks, in a token colour
const pat = (id, c) => `<pattern id="${id}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:${c};opacity:.2"/><line x1="1" y1="0" x2="1" y2="6" style="stroke:${c}" stroke-width="1.8" opacity=".85"/></pattern>`;

// ── v2 cards: each graph at about the size of its card in the app
const ULINE = `<svg class="uline" viewBox="0 0 260 8" preserveAspectRatio="none" aria-hidden="true"><path d="M3 5C50 2.5 110 6.5 160 4S230 3 257 5"/></svg>`;
const head = (title, desc, mood = "") => `<header><div><h2>${title}</h2>${ULINE}<p class="desc">${desc}</p></div>${WALLET(mood)}</header>`;
const ic = (art, c) => `<svg class="ic" viewBox="0 0 64 64" aria-hidden="true" style="--c:${c}">${art}</svg>`;
const MONTH_NAME = { May: "May", Jun: "June", Jul: "July", Aug: "August", Sep: "September", Oct: "October" };

// Credit cards: paid in full? (the cover version the owner liked, made compact)
function cardCC() {
  const clean = CC.filter(r => !Object.keys(r.interest).length).length, interest = sum(CC, r => sum(Object.values(r.interest), v => v));
  const mark = bad => `<svg viewBox="0 0 30 30" aria-hidden="true"><circle class="mk" cx="15" cy="15" r="12" style="fill:color-mix(in srgb, ${bad ? "var(--bad)" : "var(--good)"} 16%, transparent);stroke:${bad ? "var(--bad)" : "var(--good)"};stroke-width:1.7;filter:url(#skwob)"/>
    <path d="${bad ? "M10 10l10 10M20 10L10 20" : "M9 15.5l4 4 8-9"}" style="fill:none;stroke:${bad ? "var(--bad)" : "var(--good)"};stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/></svg>`;
  const streak = c => { let n = 0; for (let i = CC.length - 1; i >= 0 && !CC[i].interest[c]; i--) n++; return n; };
  return `<section class="cardx drawn full">
    ${head("Credit cards: paid in full?", "No interest on the next statement means the card was paid off in time.")}
    <p class="say"><b class="good">${clean} of ${CC.length}</b> months with no interest on either card · <b class="over">${fmt(interest, 2)}</b> interest in all</p>
    <div class="ccgrid" style="--n:${CC.length}">
      <span></span>${CC.map(r => { const bad = Object.keys(r.interest).length;
        return `<span class="mo"><svg viewBox="0 0 64 64" aria-hidden="true" style="--c:${bad ? "var(--s5)" : "var(--s3)"}">${ART.card(bad ? "worry" : "")}</svg><span class="long">${MONTH_NAME[r.m]}</span><span class="short">${r.m}</span></span>`; }).join("")}
      ${CARDS.map(c => `<span class="lab">${c}</span>` + CC.map(r => { const bad = r.interest[c];
        return `<span class="cell">${mark(bad)}${bad ? `<small class="over">${fmt(bad, 2)} interest</small>` : `<small>paid ${fmt(r.paid[c])}</small>`}</span>`; }).join("")).join("")}
      <span class="st-row"></span>${CC.map(r => { const bad = Object.keys(r.interest).length;
        return `<span class="st-row"><span class="stamp ${bad ? "bad" : "good"}">${bad ? "interest" : "paid in full"}</span></span>`; }).join("")}
    </div>
    <ul class="chips">
      <li style="--c:var(--good)"><svg viewBox="0 0 24 24">${ICON.check}</svg>Clean months <b>${clean} of ${CC.length}</b></li>
      <li style="--c:var(--bad)"><svg viewBox="0 0 24 24">${ICON.warn}</svg>Interest <b>${fmt(interest, 2)}</b></li>
      <li style="--c:var(--s1)"><svg viewBox="0 0 24 24">${ICON.card}</svg>Fees <b>$0.00</b></li>
      ${CARDS.map(c => `<li style="--c:var(--s4)"><svg viewBox="0 0 24 24">${ICON.flame}</svg>${c} streak <b>${streak(c)} month${streak(c) === 1 ? "" : "s"}</b></li>`).join("")}
    </ul>
  </section>`;
}

// Actual vs planned, by category
function cardActual() {
  const spendRows = ACTUAL.filter(r => !["Saved", "Debt payments"].includes(r.cat));
  const spent = sum(spendRows, r => r.actual), plan = sum(spendRows, r => r.plan), diff = spent - plan;
  const max = Math.max(...ACTUAL.map(r => Math.max(r.actual, r.plan))) * 1.03;
  return `<section class="cardx drawn">
    ${head("Actual vs planned", "What you really spent this month, against your plan.", diff > 0 ? "worry" : "")}
    <p class="say">Spent <b>${fmt(spent)}</b> of a <b>${fmt(plan)}</b> plan · <b class="${diff > 0 ? "over" : "good"}">${fmt(Math.abs(diff))} ${diff > 0 ? "over" : "under"}</b></p>
    <ul class="rows">${ACTUAL.map(r => {
      const saved = r.cat === "Saved", d = r.actual - r.plan, over = !saved && d > .5, c = over ? "var(--bad)" : colOf(r.cat);
      const note = saved ? (d > 0 ? `<small class="good">${fmt(d)} extra</small>` : `<small class="over">${fmt(-d)} short</small>`)
        : over ? `<small class="over">${fmt(d)} over</small>` : Math.abs(d) < 1 ? `<small>on plan</small>` : `<small class="good">${fmt(-d)} left</small>`;
      return `<li>${ic(ART[CATS[r.cat].art](over ? "worry" : ""), colOf(r.cat))}<span class="nm">${r.cat}</span>
        <span class="track"><span class="bar" style="--c:${c};width:${r.actual / max * 100}%"></span><span class="plan" style="left:${r.plan / max * 100}%"></span></span>
        <span class="fig">${fmt(r.actual)}${note}</span></li>`; }).join("")}</ul>
    <ul class="legend"><li><span class="sw dash"></span>your plan</li><li style="--c:var(--bad)"><span class="sw"></span>over plan</li></ul>
  </section>`;
}

// Money in and out by month
function cardMonths() {
  const rows = MONTHS.map(r => ({ ...r, kept: r.inc - r.spend - r.debt }));
  const best = rows.reduce((a, r) => r.kept > a.kept ? r : a), worst = rows.reduce((a, r) => r.kept < a.kept ? r : a);
  const max = Math.max(...rows.map(r => Math.max(r.inc, r.spend + r.debt))) * 1.06;
  const W = 400, H = 214, base = 184, ch = 160, gw = W / rows.length, bw = 21, y = v => base - v / max * ch;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in compared with money out for six months">
    <defs>${pat("min", "var(--s1)")}${pat("mout", "var(--s2)")}${pat("mdebt", "var(--s5)")}</defs>
    <path class="axis" d="M2 ${base}H${W - 2}"/>
    ${rows.map((r, i) => { const cx = i * gw + gw / 2;
      return `<rect class="mk" x="${cx - bw - 1.5}" y="${y(r.inc)}" width="${bw}" height="${base - y(r.inc)}" rx="2" fill="url(#min)" style="stroke:var(--s1)"/>
      <rect class="mk" x="${cx + 1.5}" y="${y(r.spend)}" width="${bw}" height="${base - y(r.spend)}" rx="2" fill="url(#mout)" style="stroke:var(--s2)"/>
      <rect class="mk" x="${cx + 1.5}" y="${y(r.spend + r.debt)}" width="${bw}" height="${y(r.spend) - y(r.spend + r.debt)}" rx="2" fill="url(#mdebt)" style="stroke:var(--s5)"/>
      <text x="${cx}" y="${base + 20}" text-anchor="middle" class="h">${r.m}</text>
      <text x="${cx}" y="${y(r.inc) - 6}" text-anchor="middle" class="v" style="fill:${r === worst ? "var(--bad)" : "var(--good)"}">+${(r.kept / 1000).toFixed(1)}k</text>`; }).join("")}
  </svg>`;
  return `<section class="cardx drawn">
    ${head("Money in and out", "Income against spending and debt payments, month by month.")}
    <p class="say">You kept <b class="good">${fmt(sum(rows, r => r.kept))}</b> over six months · every month in the green</p>
    <div class="with-note"><div class="chart">${svg}</div>
      <div class="notes"><p class="sticky"><span class="tape"></span><b>Best: ${MONTH_NAME[best.m]}</b>kept ${fmt(best.kept)}</p>
      <p class="sticky"><span class="tape"></span><b>Tight: ${MONTH_NAME[worst.m]}</b>kept ${fmt(worst.kept)}, spent ${fmt(worst.spend)}</p></div></div>
    <ul class="legend"><li style="--c:var(--s1)"><span class="sw"></span>money in</li><li style="--c:var(--s2)"><span class="sw"></span>spending</li><li style="--c:var(--s5)"><span class="sw"></span>debt payments</li></ul>
  </section>`;
}

// What changed since last month
function cardChanges() {
  const rows = CHANGES.map(r => ({ ...r, d: r.now - r.was, good: r.cat === "Saved" ? r.now >= r.was : r.now <= r.was }));
  const spendWas = 3720, net = MONTH_SPEND - spendWas, max = Math.max(...rows.map(r => Math.abs(r.d))) * 1.05;
  return `<section class="cardx drawn">
    ${head("What changed since September", "The biggest moves compared with the month before.")}
    <p class="say">Spending <b class="${net < 0 ? "good" : "over"}">${net < 0 ? "down" : "up"} ${fmt(Math.abs(net))}</b> · ${fmt(spendWas)} → <b>${fmt(MONTH_SPEND)}</b></p>
    <ul class="rows wide">${rows.map(r => { const c = r.good ? "var(--good)" : "var(--bad)", w = Math.abs(r.d) / max * 100;
      return `<li>${ic(ART[CATS[r.cat].art](r.good ? "" : "worry"), colOf(r.cat))}<span class="nm">${r.cat}<small>${fmt(r.was)} → ${fmt(r.now)}</small></span>
        <span class="split"><span>${r.d < 0 ? `<span class="bar" style="--c:${c};right:0;width:${w}%"></span>` : ""}</span><span>${r.d > 0 ? `<span class="bar" style="--c:${c};left:0;width:${w}%"></span>` : ""}</span></span>
        <span class="fig"><span class="pill ${r.good ? "good" : "over"}">${r.d > 0 ? "▲" : "▼"} ${fmt(Math.abs(r.d))}</span></span></li>`; }).join("")}</ul>
    <ul class="legend"><li style="--c:var(--good)"><span class="sw"></span>good move</li><li style="--c:var(--bad)"><span class="sw"></span>costs more</li><li>left of the line = less, right = more</li></ul>
  </section>`;
}

// Where you spent the most
function cardMerchants() {
  const top = sum(MERCHANTS, m => m.amount), max = MERCHANTS[0].amount;
  return `<section class="cardx drawn">
    ${head("Where you spent the most", "Your top places this month.")}
    <p class="say">Your top 8 places took <b>${Math.round(top / MONTH_SPEND * 100)}%</b> of <b>${fmt(MONTH_SPEND)}</b></p>
    <ul class="rows wide">${MERCHANTS.map((m, i) => `<li>${ic(ART[m.art](""), colOf(m.cat))}
      <span class="nm"><span class="rank">${i + 1}</span>${m.name}<small>${m.visits} visit${m.visits > 1 ? "s" : ""}${m.visits > 1 ? ` · about ${fmt(m.amount / m.visits)} each` : ""}</small></span>
      <span class="track"><span class="bar" style="--c:${colOf(m.cat)};width:${m.amount / max * 100}%"></span></span>
      <span class="fig">${fmt(m.amount)}<small>${Math.round(m.amount / MONTH_SPEND * 100)}%</small></span></li>`).join("")}</ul>
    <ul class="legend">${["home", "everyday", "fun"].map(g => `<li style="--c:${GROUPS[g].c}"><span class="sw"></span>${GROUPS[g].name}</li>`).join("")}</ul>
  </section>`;
}

document.getElementById("sheet").innerHTML = cardCC() + cardActual() + cardMonths() + cardChanges() + cardMerchants();
</script>
</body>
</html>
